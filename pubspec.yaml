name: agnidriver2025
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+24

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # UI / Icons
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  font_awesome_flutter: ^11.0.0
  cupertino_icons: ^1.0.8
  auto_size_text: ^3.0.0
  carousel_slider: ^5.0.0
  table_calendar: ^3.1.2

  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.1
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  
  # Networking / Storage
  http: ^1.3.0
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4
  fluttertoast: ^8.2.6
  intl: ^0.20.2
  flutter_svg: ^2.0.9
  # Firebase / Notifications
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^19.4.2

  # Maps / Location
  google_maps_flutter: ^2.11.0
  geolocator: ^14.0.2
  location: ^8.0.1
  geocoding: ^4.0.0

  # File Handling / PDF
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  open_file: ^3.5.10

  # Payments
  razorpay_flutter: ^1.3.5

  # Utility
  cupertino_will_pop_scope: ^1.2.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.1   # ✅ downgraded to fix geolocator conflict

  # Code Quality / Icons
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter


