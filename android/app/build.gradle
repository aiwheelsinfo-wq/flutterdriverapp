plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'

}

android {
    namespace "com.AgniDriver.agnidriver2025"
    compileSdk flutter.compileSdkVersion
    ndkVersion "28.2.13676358"   // 🔥 use local installed version
 
    compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
}

kotlinOptions {
    jvmTarget = "17"
}

   defaultConfig {
    applicationId = "com.AgniDriver.agnidriver2025"
    minSdkVersion flutter.minSdkVersion  // Set manually if needed
    targetSdkVersion 35  // Set manually if needed
    versionCode 24  // Bumped for FCM fix - correct Firebase project
    versionName "1.0.1"  // FCM notification fix release
}
    signingConfigs {
        debug {
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
        }
         release {
            storeFile file(rootProject.file("keystore.jks"))
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "agni2025"
            keyAlias System.getenv("KEY_ALIAS") ?: "my-key-alias"
            keyPassword System.getenv("KEY_PASSWORD") ?: "agni2025"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.25"  // ✅ match project level
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'// Only the correct desugar version
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"   
}
